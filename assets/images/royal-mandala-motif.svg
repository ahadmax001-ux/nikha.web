      <path d="M 0,-75 C -15,-105 0,-138 0,-140 C 0,-138 15,-105 0,-75 Z" transform="rotate(292.5)"/>
      <path d="M 0,-75 C -15,-105 0,-138 0,-140 C 0,-138 15,-105 0,-75 Z" transform="rotate(315)"/>
      <path d="M 0,-75 C -15,-105 0,-138 0,-140 C 0,-138 15,-105 0,-75 Z" transform="rotate(337.5)"/>
