      <circle cx="0" cy="-282" r="2.8" transform="rotate(22.5)"/>
      <circle cx="0" cy="-282" r="2.8" transform="rotate(45)"/>
      <circle cx="0" cy="-282" r="2.8" transform="rotate(67.5)"/>
      <circle cx="0" cy="-282" r="2.8" transform="rotate(90)"/>
      <circle cx="0" cy="-282" r="2.8" transform="rotate(112.5)"/>
      <circle cx="0" cy="-282" r="2.8" transform="rotate(135)"/>
      <circle cx="0" cy="-282" r="2.8" transform="rotate(157.5)"/>
      <circle cx="0" cy="-282" r="2.8" transform="rotate(180)"/>
      <circle cx="0" cy="-282" r="2.8" transform="rotate(202.5)"/>
      <circle cx="0" cy="-282" r="2.8" transform="rotate(225)"/>
      <circle cx="0" cy="-282" r="2.8" transform="rotate(247.5)"/>
      <circle cx="0" cy="-282" r="2.8" transform="rotate(270)"/>
      <circle cx="0" cy="-282" r="2.8" transform="rotate(292.5)"/>
