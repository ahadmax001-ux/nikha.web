<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 120" width="100%" height="100%">
  <defs>
    <linearGradient id="bismillahGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#BF953F"/>
      <stop offset="25%" stop-color="#FCF6BA"/>
      <stop offset="50%" stop-color="#B38728"/>
      <stop offset="75%" stop-color="#FBF5B7"/>
      <stop offset="100%" stop-color="#AA771C"/>
    </linearGradient>
    <filter id="goldShine" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#7B6149" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Traditional Calligraphic representation of Bismillahir Rahmanir Raheem -->
  <g fill="url(#bismillahGold)" filter="url(#goldShine)">
    <!-- Decorative side flourishes -->
    <path d="M 40,60 C 70,50 85,70 110,60 C 95,55 90,45 80,48 C 65,52 50,56 40,60 Z" opacity="0.8"/>
    <path d="M 460,60 C 430,50 415,70 390,60 C 405,55 410,45 420,48 C 435,52 450,56 460,60 Z" opacity="0.8"/>
    <circle cx="25" cy="60" r="3"/>
    <circle cx="475" cy="60" r="3"/>

    <!-- Central Calligraphy Text -->
    <text x="250" y="72" text-anchor="middle" font-family="'Traditional Arabic', 'Scheherazade New', 'Amiri', 'Lateef', serif" font-size="44" font-weight="bold" letter-spacing="2">
      بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ
    </text>
  </g>
</svg>
