      <path d="M -26,-215 C -30,-250 0,-275 0,-275 C 0,-275 30,-250 26,-215" transform="rotate(22.5)"/>
      <path d="M -26,-215 C -30,-250 0,-275 0,-275 C 0,-275 30,-250 26,-215" transform="rotate(45)"/>
