<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="cornerGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#BF953F"/>
      <stop offset="50%" stop-color="#FCF6BA"/>
      <stop offset="100%" stop-color="#B38728"/>
    </linearGradient>
  </defs>

  <!-- Ornate corner scrollwork and botanical curves -->
  <g stroke="url(#cornerGold)" fill="none" stroke-linecap="round">
    <path d="M 15,185 L 15,40 A 25,25 0 0,1 40,15 L 185,15" stroke-width="2.5"/>
    <path d="M 28,175 L 28,48 A 20,20 0 0,1 48,28 L 175,28" stroke-width="1" stroke-dasharray="4,3" opacity="0.8"/>
    <path d="M 15,15 Q 60,60 85,35 Q 110,10 60,15" stroke-width="1.5"/>
    <path d="M 15,15 Q 60,60 35,85 Q 10,110 15,60" stroke-width="1.5"/>
  </g>

  <!-- Watercolor-style rose blossom at corner apex -->
  <g transform="translate(48, 48)">
    <!-- Leaves -->
    <ellipse cx="-12" cy="18" rx="14" ry="7" fill="#8FA489" transform="rotate(45 -12 18)" opacity="0.85"/>
    <ellipse cx="18" cy="-12" rx="14" ry="7" fill="#8FA489" transform="rotate(-45 18 -12)" opacity="0.85"/>
    <!-- Rose layers -->
    <circle cx="0" cy="0" r="18" fill="#F8E5E1"/>
    <circle cx="0" cy="0" r="14" fill="#E8A598" opacity="0.85"/>
    <circle cx="0" cy="0" r="9" fill="#D8827C" opacity="0.9"/>
    <circle cx="0" cy="0" r="4" fill="#FFFFFF" opacity="0.9"/>
  </g>

  <!-- Accent buds -->
  <circle cx="95" cy="20" r="4" fill="#E8A598"/>
  <circle cx="130" cy="15" r="3" fill="#D4AF37"/>
  <circle cx="20" cy="95" r="4" fill="#E8A598"/>
  <circle cx="15" cy="130" r="3" fill="#D4AF37"/>
</svg>
