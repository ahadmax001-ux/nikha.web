<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF6F0"/>
      <stop offset="50%" stop-color="#F3ECE5"/>
      <stop offset="100%" stop-color="#EBE1D7"/>
    </linearGradient>
    <radialGradient id="candleGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFDF0" stop-opacity="1"/>
      <stop offset="35%" stop-color="#FCD34D" stop-opacity="0.8"/>
      <stop offset="70%" stop-color="#F59E0B" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#D97706" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="goldCandelabra" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#B48628"/>
      <stop offset="50%" stop-color="#FCEBA4"/>
      <stop offset="100%" stop-color="#9C6F1E"/>
    </linearGradient>
  </defs>

  <rect width="800" height="600" fill="url(#bgGrad4)"/>
  <rect x="25" y="25" width="750" height="550" rx="16" fill="none" stroke="#D4AF37" stroke-width="1.5" stroke-opacity="0.5"/>
  <rect x="35" y="35" width="730" height="530" rx="12" fill="none" stroke="#E8A598" stroke-width="0.8" stroke-opacity="0.4" stroke-dasharray="6,4"/>

  <!-- Golden 5-Arm Candelabra -->
  <g transform="translate(400, 240)">
    <!-- Base -->
    <path d="M-50,150 C-40,140 -20,135 0,135 C20,135 40,140 50,150 Z" fill="url(#goldCandelabra)"/>
    <rect x="-10" y="20" width="20" height="115" fill="url(#goldCandelabra)"/>
    
    <!-- Curved arms -->
    <path d="M-10,80 C-70,80 -100,20 -100,-20" fill="none" stroke="url(#goldCandelabra)" stroke-width="7" stroke-linecap="round"/>
    <path d="M-10,60 C-130,60 -180,-10 -180,-60" fill="none" stroke="url(#goldCandelabra)" stroke-width="7" stroke-linecap="round"/>
    <path d="M10,80 C70,80 100,20 100,-20" fill="none" stroke="url(#goldCandelabra)" stroke-width="7" stroke-linecap="round"/>
    <path d="M10,60 C130,60 180,-10 180,-60" fill="none" stroke="url(#goldCandelabra)" stroke-width="7" stroke-linecap="round"/>

    <!-- Candle holders & candles -->
    <!-- Center candle -->
    <rect x="-16" y="10" width="32" height="10" rx="2" fill="url(#goldCandelabra)"/>
    <rect x="-7" y="-50" width="14" height="60" fill="#FFFFF0" rx="2"/>
    <!-- Outer candle left -->
    <rect x="-192" y="-70" width="24" height="10" rx="2" fill="url(#goldCandelabra)"/>
    <rect x="-185" y="-120" width="10" height="50" fill="#FFFFF0" rx="2"/>
    <!-- Inner candle left -->
    <rect x="-112" y="-30" width="24" height="10" rx="2" fill="url(#goldCandelabra)"/>
    <rect x="-105" y="-85" width="10" height="55" fill="#FFFFF0" rx="2"/>
    <!-- Inner candle right -->
    <rect x="88" y="-30" width="24" height="10" rx="2" fill="url(#goldCandelabra)"/>
    <rect x="95" y="-85" width="10" height="55" fill="#FFFFF0" rx="2"/>
    <!-- Outer candle right -->
    <rect x="168" y="-70" width="24" height="10" rx="2" fill="url(#goldCandelabra)"/>
    <rect x="175" y="-120" width="10" height="50" fill="#FFFFF0" rx="2"/>

    <!-- Flames with soft glow halos -->
    <!-- Center flame -->
    <circle cx="0" cy="-68" r="32" fill="url(#candleGlow)"/>
    <path d="M0,-80 Q-7,-65 0,-52 Q7,-65 0,-80" fill="#FFB703"/>
    <path d="M0,-74 Q-4,-64 0,-56 Q4,-64 0,-74" fill="#FFFFFF"/>

    <!-- Left Outer flame -->
    <circle cx="-180" cy="-138" r="28" fill="url(#candleGlow)"/>
    <path d="M-180,-148 Q-186,-135 -180,-122 Q-174,-135 -180,-148" fill="#FFB703"/>
    <path d="M-180,-143 Q-183,-134 -180,-126 Q-177,-134 -180,-143" fill="#FFFFFF"/>

    <!-- Left Inner flame -->
    <circle cx="-100" cy="-103" r="28" fill="url(#candleGlow)"/>
    <path d="M-100,-113 Q-106,-100 -100,-87 Q-94,-100 -100,-113" fill="#FFB703"/>
    <path d="M-100,-108 Q-103,-99 -100,-91 Q-97,-99 -100,-108" fill="#FFFFFF"/>

    <!-- Right Inner flame -->
    <circle cx="100" cy="-103" r="28" fill="url(#candleGlow)"/>
    <path d="M100,-113 Q94,-100 100,-87 Q106,-100 100,-113" fill="#FFB703"/>
    <path d="M100,-108 Q97,-99 100,-91 Q103,-99 100,-108" fill="#FFFFFF"/>

    <!-- Right Outer flame -->
    <circle cx="180" cy="-138" r="28" fill="url(#candleGlow)"/>
    <path d="M180,-148 Q174,-135 180,-122 Q186,-135 180,-148" fill="#FFB703"/>
    <path d="M180,-143 Q177,-134 180,-126 Q183,-134 180,-143" fill="#FFFFFF"/>

    <!-- Base Floral Wreath / Centerpiece -->
    <g transform="translate(0, 140)">
      <ellipse cx="0" cy="5" rx="140" ry="25" fill="#FAF2EC" stroke="#E8A598" stroke-width="0.8"/>
      <!-- Floral buds -->
      <circle cx="-60" cy="5" r="16" fill="#F8E5E1"/>
      <circle cx="-60" cy="5" r="11" fill="#E8A598"/>
      <circle cx="60" cy="5" r="16" fill="#F8E5E1"/>
      <circle cx="60" cy="5" r="11" fill="#E8A598"/>
      <circle cx="0" cy="8" r="20" fill="#FAF0EA"/>
      <circle cx="0" cy="8" r="14" fill="#D8827C"/>
    </g>
  </g>

  <!-- Typography Labels -->
  <text x="400" y="475" text-anchor="middle" font-family="'Playfair Display', Georgia, serif" font-size="24" font-weight="600" fill="#3D312A" letter-spacing="3">FEAST &amp; HOSPITALITY</text>
  <text x="400" y="505" text-anchor="middle" font-family="'Montserrat', sans-serif" font-size="12" font-weight="500" fill="#8C7768" letter-spacing="4">TRADITIONAL WELCOME</text>
  <line x1="330" y1="485" x2="470" y2="485" stroke="#D4AF37" stroke-width="0.8" opacity="0.6"/>
</svg>
