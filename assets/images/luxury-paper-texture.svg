<svg xmlns="http://www.w3.org/2000/svg" width="160" height="160" viewBox="0 0 160 160">
  <defs>
    <!-- Subtle gold dust speckles -->
    <radialGradient id="goldSpeck" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#C5A059" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#C5A059" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="fiberSpeck" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8F7862" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#8F7862" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Linen weave / vellum fiber texture lines -->
  <g stroke="#C5A059" stroke-opacity="0.04" stroke-width="0.75" stroke-linecap="round">
    <line x1="0" y1="20" x2="160" y2="20" stroke-dasharray="8,12,4,16"/>
    <line x1="0" y1="60" x2="160" y2="60" stroke-dasharray="14,8,6,12"/>
    <line x1="0" y1="100" x2="160" y2="100" stroke-dasharray="10,14,8,8"/>
    <line x1="0" y1="140" x2="160" y2="140" stroke-dasharray="12,10,4,14"/>

    <line x1="20" y1="0" x2="20" y2="160" stroke-dasharray="10,12,6,12"/>
    <line x1="60" y1="0" x2="60" y2="160" stroke-dasharray="6,16,10,8"/>
    <line x1="100" y1="0" x2="100" y2="160" stroke-dasharray="14,8,4,14"/>
    <line x1="140" y1="0" x2="140" y2="160" stroke-dasharray="8,14,12,6"/>
  </g>

  <!-- Tiny botanical gold speckles -->
  <circle cx="28" cy="44" r="2.5" fill="url(#goldSpeck)"/>
  <circle cx="88" cy="18" r="3" fill="url(#goldSpeck)"/>
  <circle cx="134" cy="72" r="2" fill="url(#goldSpeck)"/>
  <circle cx="48" cy="112" r="3.2" fill="url(#goldSpeck)"/>
  <circle cx="118" cy="136" r="2.8" fill="url(#goldSpeck)"/>
  <circle cx="74" cy="82" r="1.8" fill="url(#goldSpeck)"/>

  <!-- Organic handmade paper fibers -->
  <path d="M 12,68 Q 18,72 26,69" stroke="#9E8770" stroke-opacity="0.07" stroke-width="0.8" fill="none"/>
  <path d="M 94,36 Q 102,32 108,38" stroke="#9E8770" stroke-opacity="0.06" stroke-width="0.75" fill="none"/>
  <path d="M 62,130 Q 68,135 76,132" stroke="#9E8770" stroke-opacity="0.065" stroke-width="0.8" fill="none"/>
  <path d="M 132,104 Q 138,109 146,106" stroke="#9E8770" stroke-opacity="0.06" stroke-width="0.7" fill="none"/>

  <!-- Subtle Indian jaali arch watermark in background -->
  <g stroke="#C5A059" stroke-opacity="0.035" stroke-width="0.6" fill="none">
    <path d="M 80,0 C 80,25 95,45 120,45 C 145,45 160,25 160,0"/>
    <path d="M 0,0 C 0,25 15,45 40,45 C 65,45 80,25 80,0"/>
    <path d="M 80,160 C 80,135 95,115 120,115 C 145,115 160,135 160,160"/>
    <path d="M 0,160 C 0,135 15,115 40,115 C 65,115 80,135 80,160"/>
    <circle cx="80" cy="80" r="18" stroke-dasharray="2,3"/>
    <circle cx="80" cy="80" r="36" stroke-opacity="0.025"/>
  </g>
</svg>
