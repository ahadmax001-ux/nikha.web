    <circle r="45" stroke-width="1.2" stroke-dasharray="3,3"/>
    <circle r="75" stroke-width="1.5"/>
    <circle r="95" stroke-width="0.8" stroke-dasharray="5,4"/>
    <circle r="140" stroke-width="1.5"/>
    <circle r="155" stroke-width="1" stroke-dasharray="2,3"/>
    <circle r="215" stroke-width="1.8"/>
    <circle r="235" stroke-width="0.9" stroke-dasharray="4,4"/>
    <circle r="275" stroke-width="2"/>
    <circle r="290" stroke-width="0.8" stroke-dasharray="6,4"/>

    <!-- 16-Fold Royal Lotus Radiance -->
    <!-- Lotus Petal Tier 1 -->
    <g stroke-width="1.2">
      <!-- 16 Petals rotated 22.5 deg -->
      <path d="M 0,-75 C -15,-105 0,-138 0,-140 C 0,-138 15,-105 0,-75 Z"/>
      <path d="M 0,-75 C -15,-105 0,-138 0,-140 C 0,-138 15,-105 0,-75 Z" transform="rotate(22.5)"/>
      <path d="M 0,-75 C -15,-105 0,-138 0,-140 C 0,-138 15,-105 0,-75 Z" transform="rotate(45)"/>
      <path d="M 0,-75 C -15,-105 0,-138 0,-140 C 0,-138 15,-105 0,-75 Z" transform="rotate(67.5)"/>
      <path d="M 0,-75 C -15,-105 0,-138 0,-140 C 0,-138 15,-105 0,-75 Z" transform="rotate(90)"/>
      <path d="M 0,-75 C -15,-105 0,-138 0,-140 C 0,-138 15,-105 0,-75 Z" transform="rotate(112.5)"/>
      <path d="M 0,-75 C -15,-105 0,-138 0,-140 C 0,-138 15,-105 0,-75 Z" transform="rotate(135)"/>
      <path d="M 0,-75 C -15,-105 0,-138 0,-140 C 0,-138 15,-105 0,-75 Z" transform="rotate(157.5)"/>
      <path d="M 0,-75 C -15,-105 0,-138 0,-140 C 0,-138 15,-105 0,-75 Z" transform="rotate(180)"/>
      <path d="M 0,-75 C -15,-105 0,-138 0,-140 C 0,-138 15,-105 0,-75 Z" transform="rotate(202.5)"/>
      <path d="M 0,-75 C -15,-105 0,-138 0,-140 C 0,-138 15,-105 0,-75 Z" transform="rotate(225)"/>
