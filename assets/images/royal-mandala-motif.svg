      <path d="M -26,-215 C -30,-250 0,-275 0,-275 C 0,-275 30,-250 26,-215" transform="rotate(112.5)"/>
      <path d="M -26,-215 C -30,-250 0,-275 0,-275 C 0,-275 30,-250 26,-215" transform="rotate(135)"/>
      <path d="M -26,-215 C -30,-250 0,-275 0,-275 C 0,-275 30,-250 26,-215" transform="rotate(157.5)"/>
      <path d="M -26,-215 C -30,-250 0,-275 0,-275 C 0,-275 30,-250 26,-215" transform="rotate(180)"/>
      <path d="M -26,-215 C -30,-250 0,-275 0,-275 C 0,-275 30,-250 26,-215" transform="rotate(202.5)"/>
      <path d="M -26,-215 C -30,-250 0,-275 0,-275 C 0,-275 30,-250 26,-215" transform="rotate(225)"/>
      <path d="M -26,-215 C -30,-250 0,-275 0,-275 C 0,-275 30,-250 26,-215" transform="rotate(247.5)"/>
      <path d="M -26,-215 C -30,-250 0,-275 0,-275 C 0,-275 30,-250 26,-215" transform="rotate(270)"/>
      <path d="M -26,-215 C -30,-250 0,-275 0,-275 C 0,-275 30,-250 26,-215" transform="rotate(292.5)"/>
