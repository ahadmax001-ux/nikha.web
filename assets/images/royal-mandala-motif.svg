<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <linearGradient id="mandalaGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C5A059" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#F7E5B5" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#9E7B35" stop-opacity="0.8"/>
    </linearGradient>
  </defs>

  <g transform="translate(300, 300)" stroke="url(#mandalaGold)" fill="none" stroke-linecap="round">
